name: Go build and vet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: go build + go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.work
          cache: false
      - name: Build and vet every module of the workspace
        run: |
          set -e
          for m in package examples mt5; do
            echo "::group::$m"
            (cd "$m" && go build ./... && go vet ./...)
            echo "::endgroup::"
          done
